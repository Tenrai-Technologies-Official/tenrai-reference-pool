[package]
name = "tenrai-pool"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Reference mining pool for Tenrai: PPLNS and SOLO over tenrai-mining-v1 and v2, payouts through the wallet daemon"
homepage = "https://tenrai-technologies.org"

[[bin]]
name = "tenrai-pool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
axum = "0.8.1"
bech32 = "0.11.0"
bytes = "1.9.0"
clap = { version = "4.5.27", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1.10", features = ["tokio", "service"] }
libcrux-ml-dsa = { version = "=0.0.10", default-features = false, features = ["mldsa65"] }
nu-ansi-term = "0.50.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "fallible_uint"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
sha3 = "0.10.8"
tenrai-platform = { path = "crates/platform" }
thiserror = "2.0.11"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-rustls = "=0.26.5"
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono"] }
url = "2.5.4"
webpki-roots = "=1.0.10"
rcgen = { version = "=0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }

[dev-dependencies]
axum = { version = "0.8.1", features = ["ws"] }

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[profile.dev]
debug = 1
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
