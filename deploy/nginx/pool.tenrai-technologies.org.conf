# Proxy the website on 28772 and WebSocket mining on 28743 and 28747.
# Set --ws-origin for trusted browser miners. Requires nginx 1.25.1 or later.

limit_req_zone $binary_remote_addr zone=tenrai_pool:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=tenrai_pool_handshakes:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=tenrai_pool_conn:10m;
limit_conn_zone $binary_remote_addr zone=tenrai_pool_miners:10m;

map $uri $tenrai_pool_ws_port {
    default   28743;
    /solo/    28747;
}

upstream tenrai_pool_web {
    server 127.0.0.1:28772;
    keepalive 16;
    # Expire proxy connections before the pool's idle timeout.
    keepalive_timeout 8s;
}

server {
    listen 80;
    listen [::]:80;
    server_name pool.tenrai-technologies.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pool.tenrai-technologies.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pool.tenrai-technologies.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.tenrai-technologies.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tenrai_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    large_client_header_buffers 4 8k;
    keepalive_timeout 30s;
    send_timeout 15s;
    reset_timedout_connection on;

    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /metrics {
        return 404;
    }

    # Keep X-Real-IP when this location overrides the proxy headers.
    location ~ "^/(pplns|solo)/$" {
        limit_req zone=tenrai_pool_handshakes burst=20 nodelay;
        limit_conn tenrai_pool_miners 32;
        proxy_pass http://127.0.0.1:$tenrai_pool_ws_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=tenrai_pool burst=60 nodelay;
        limit_conn tenrai_pool_conn 32;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://tenrai_pool_web;
    }
}
